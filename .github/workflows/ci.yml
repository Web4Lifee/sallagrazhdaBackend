# Runs on every push and pull request: typecheck, lint, format, tests against a real
# PostgreSQL, a dependency audit, and a Docker build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sallagrazhda
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: sallagrazhda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sallagrazhda -d sallagrazhda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sallagrazhda:localdev@localhost:5432/sallagrazhda_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: docker build -t sallagrazhda-backend:ci .
