# Netlify hosting: the API runs as the Netlify Function netlify/functions/api.ts, plus the hourly
# netlify/functions/housekeeping.ts. Setup steps: docs/NETLIFY.md

[build]
  # Netlify bundles the functions itself; this only stops a deploy whose code doesn't typecheck.
  command = "npm run typecheck"
  # Holds only robots.txt. Without it Netlify publishes the whole repository as public files.
  publish = "public"
