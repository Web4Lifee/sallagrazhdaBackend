# PRODUCTION — run on the server from this folder, with a filled-in .env next to it:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443, automatic HTTPS).
# The API and the database sit on private Docker networks; the database has no internet access.
# See docs/DEPLOYMENT.md for the full checklist.

name: sallagrazhda

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-api-image: &api-image
  build: .
  image: sallagrazhda-backend:latest

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [web]
    logging: *logging

  api:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      # Caddy reaches the API over Docker's private network.
      TRUST_PROXY: uniquelocal
      TZ: ${TZ:-Europe/Tirane}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [web, internal]
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # Applies database migrations, then exits. The API only starts after it succeeds.
  migrate:
    <<: [*api-image, *hardening]
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    networks: [internal]
    logging: *logging

  # Daily compressed database dump into ./backups (kept BACKUP_KEEP_DAYS days).
  # Copy these files off the server regularly — see docs/DEPLOYMENT.md.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup-loop.sh']
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    logging: *logging

networks:
  web: {}
  internal:
    internal: true

volumes:
  db-data:
  caddy-data:
  caddy-config:
